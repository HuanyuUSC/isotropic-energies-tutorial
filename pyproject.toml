[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "distortion"
version = "0.1.0"
description = "Helpers for the isotropic distortion energies tutorial"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Huanyu Chen"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
mesh = ["trimesh", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]
